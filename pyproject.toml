[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rootguard"
version = "0.7.1"
description = "Root.sh: provenance-based defense layer for OS-level autonomous agents"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "numpy==2.4.6",
    "pandas==3.1.0",
    "pydantic==2.14.1",
    "scikit-learn==1.9.1",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
"root.sh" = "rootguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
